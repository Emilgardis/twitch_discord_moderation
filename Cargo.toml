[package]
name = "twitch-discord-moderation"
version = "0.7.1"
authors = ["Emil Gardström <emil.gardstrom@gmail.com>"]
edition = "2024"
license = "MIT OR APACHE-2.0"
default-run = "twitch-discord-moderation"
readme = "README.md"
description = "Bot to send twitch moderator actions to a discord webhook"
publish = false
repository = "https://github.com/Emilgardis/twitch_discord_moderation"
build = "build.rs"
rust-version = "1.95"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "std",
    "fmt",
] }
tracing-futures = "0.2.5"
tracing-log = "0.2.0"
color-eyre = "0.6.5"
eyre = "0.6.12"
time = "0.3.51"
owo-colors = "4.3.0"
dotenvy = "0.15.7"
twitch_api = { version = "0.8.0", features = ["reqwest", "helix", "eventsub", "trace_unknown_fields"] }
twitch_types = { version = "0.4.10", features = ["time"] }
tokio-tungstenite = { version = "0.29.0", features = ["native-tls", "url"] }
reqwest = { version = "0.13.4", features = ["json"] }
url = "2.5.8"
futures = "0.3.32"
humantime = "2.3.0"
serde = "1.0.228"
serde_json = "1.0.150"
fastrand = "2.4.1"
clap = { version = "4.6.1", features = ["derive", "env"] }
once_cell = "1.21.4"
serenity = { version = "0.12.5", default-features = false, features = ["model", "rustls_backend"], git = "https://github.com/serenity-rs/serenity/", rev = "d58eb74" }

[workspace]
members = ["xtask"]

[build-dependencies]
built = { version = "0.8.1", features = ["chrono", "git2"] }

[dev-dependencies]
pretty_assertions = "1.4.1"

[target.'cfg(all(not(any(target_os = "windows", target_os = "macos", target_os = "ios")), target_env = "musl"))'.dependencies]
#openssl = { version = "0.10.33", features = ["vendored"] }

[patch.crates-io]
#twitch_api = { path = "../twitch_api" }
#twitch_oauth2 = { path = "../twitch_oauth2" }
#twitch_api = { git = "https://github.com/twitch-rs/twitch_api.git" }
